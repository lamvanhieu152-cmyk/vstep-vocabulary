const KEY='vstep_vocab_v3';
const PKEY='vstep_phrases_v1';
const DKEY='vstep_day_v3';
let vocab=load(KEY,INITIAL_VOCAB), phrases=load(PKEY,INITIAL_PHRASES);
let state=load(DKEY,{date:'',newToday:0,todayIds:[],phraseIds:[]});
let view='start', queue=[], idx=0, mode='new';
function load(k, fallback){try{let x=JSON.parse(localStorage.getItem(k));return x??fallback}catch(e){return fallback}}
function save(){localStorage.setItem(KEY,JSON.stringify(vocab));localStorage.setItem(PKEY,JSON.stringify(phrases));localStorage.setItem(DKEY,JSON.stringify(state));}
function today(){return new Date().toISOString().slice(0,10)}
function resetDay(){if(state.date!==today()){state={date:today(),newToday:0,todayIds:[],phraseIds:[]};save()}}
function speak(t,rate=1){if('speechSynthesis' in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=rate;speechSynthesis.speak(u)}}
function due(w){return !w.nextReview || w.nextReview<=today()}
function intervals(level){return [0,1,3,7,14,30][Math.max(0,Math.min(5,level))]}
function setReview(w,remembered){let old=w.level||0;w.level=remembered?Math.min(5,old+1):Math.max(0,old-1);w.lastReviewed=today();let d=intervals(w.level);let dt=new Date();dt.setDate(dt.getDate()+d);w.nextReview=d?dt.toISOString().slice(0,10):today();}
function availableNew(){return vocab.filter(w=>(w.level||0)===0 && !state.todayIds.includes(w.id))}
function dueWords(){return vocab.filter(w=>due(w) && (w.level||0)>0 && !state.todayIds.includes(w.id))}
function buildTodayQueue(){resetDay();let need=Math.max(0,10-state.newToday);let q=[...dueWords(),...availableNew()];let seen=new Set();q=q.filter(w=>!seen.has(w.id)&&seen.add(w.id)).slice(0,need);return q}
function markToday(w,isNew=true){if(!state.todayIds.includes(w.id))state.todayIds.push(w.id);if(isNew)state.newToday=Math.min(10,state.newToday+1);save()}
function nav(){document.getElementById('nav').innerHTML=['start|🌱 Bắt đầu','phrases|💬 Cụm từ','review|🔄 Ôn tập','list|📝 Từ vựng','stats|📊 Tiến độ','data|📥 Nạp JSON'].map(x=>{let [id,t]=x.split('|');return `<button class="${view===id?'active':''}" onclick="go('${id}')">${t}</button>`}).join('')}
function go(v){view=v;nav();render()}
function render(){resetDay();let a=document.getElementById('app');if(view==='start')start(a);if(view==='phrases')phrasePage(a);if(view==='review')reviewPage(a);if(view==='list')listPage(a);if(view==='stats')statsPage(a);if(view==='data')dataPage(a)}
function start(a){let done=state.newToday, pct=done*10;let q=buildTodayQueue();a.innerHTML=`<div class="grid"><div class="stat"><b>${done}/10</b><span class="muted">Từ hôm nay</span></div><div class="stat"><b>${vocab.filter(w=>(w.level||0)>=4).length}</b><span class="muted">Từ vững</span></div><div class="stat"><b>${vocab.length}</b><span class="muted">Tổng từ</span></div></div><div class="card section"><h2>🌱 Học hôm nay</h2><p class="muted">App tự ưu tiên từ đến hạn ôn, sau đó thêm từ mới cho đủ 10 từ.</p><div class="progress"><div style="width:${pct}%"></div></div><div class="actions">${done<10?`<button class="action primary" onclick="startStudy('daily')">▶ Bắt đầu học ${Math.min(10-done,q.length)} từ</button>`:`<button class="action primary" onclick="reviewToday()">🔄 Ôn lại 10 từ hôm nay</button>`}<button class="action secondary" onclick="go('phrases')">💬 Học cụm từ cơ bản</button></div>${done>=10?'<b>🎉 Bạn đã hoàn thành mục tiêu 10 từ hôm nay!</b>':''}</div><div class="card section"><h3>🎯 3 từ cần chú ý</h3>${vocab.filter(w=>(w.level||0)<=1).slice(0,3).map(w=>`<p><b>${esc(w.en)}</b> — ${esc(w.vi)}</p>`).join('')||'<p class="muted">Chưa có từ cần chú ý.</p>'}</div>`}
function startStudy(m){mode=m;queue=buildTodayQueue();idx=0;if(!queue.length){alert('Hiện không có từ phù hợp.');return}view='study';nav();study()}
function reviewToday(){resetDay();queue=vocab.filter(w=>state.todayIds.includes(w.id)).slice(-10);idx=0;mode='reviewToday';view='study';nav();study()}
function study(){let a=document.getElementById('app');if(idx>=queue.length){finishStudy();return}let w=queue[idx];a.innerHTML=`<div class="study"><div class="card"><span class="muted">Từ ${idx+1} / ${queue.length} • ${mode==='reviewToday'?'Ôn lại':'Học hôm nay'}</span><div class="vi">${esc(w.vi)}</div><div id="answer" class="hidden"><div class="word">${esc(w.en)}</div><div class="ipa">${esc(w.ipa||'')}</div><div class="example"><b>${esc(w.example||'')}</b></div></div><div class="actions"><button class="action primary" onclick="speak('${js(w.en)}')">🔊 Nghe</button><button class="action secondary" onclick="speak('${js(w.en)}',.7)">🐢 Chậm</button><button class="action secondary" onclick="document.getElementById('answer').classList.remove('hidden')">👀 Hiện từ</button></div><div id="test" class="hidden"><label>✍️ Gõ lại từ:</label><input id="typed" autocomplete="off" onkeydown="if(event.key==='Enter')checkTyped()"><div id="feedback"></div></div><div class="actions"><button class="action secondary" onclick="showTest()">✍️ Tôi muốn tự nhớ</button></div><div id="rate" class="hidden"><div class="choices"><button class="action bad" onclick="answer(false)">❌ Chưa nhớ</button><button class="action good" onclick="answer(true)">✅ Đã nhớ</button></div></div></div></div>`}
function showTest(){document.getElementById('answer').classList.remove('hidden');document.getElementById('test').classList.remove('hidden');document.getElementById('rate').classList.remove('hidden');document.getElementById('typed').focus()}
function checkTyped(){let w=queue[idx],v=document.getElementById('typed').value.trim().toLowerCase(),ok=v===w.en.toLowerCase();document.getElementById('feedback').innerHTML=ok?'✅ Chính xác!':'❌ Gần đúng, từ là <b>'+esc(w.en)+'</b>';}
function answer(ok){let w=queue[idx];setReview(w,ok);if(mode!=='reviewToday')markToday(w,true);save();idx++;study()}
function finishStudy(){view='start';nav();render();alert('🎉 Bạn đã hoàn thành lượt học!')}
function phrasePage(a){a.innerHTML=`<div class="card"><h2>💬 Cụm từ cơ bản</h2><p class="muted">Học cả cụm thay vì dịch từng từ. Rất hữu ích cho giao tiếp và VSTEP.</p><div class="actions"><button class="action primary" onclick="startPhraseStudy()">▶ Học 10 cụm</button></div></div><div class="phrase-list section">${phrases.map((p,i)=>`<div class="card"><span class="phrase-cat">${esc(p.cat)}</span><div class="word">${esc(p.en)}</div><div class="ipa">${esc(p.ipa)}</div><div class="vi">${esc(p.vi)}</div><div class="example"><b>${esc(p.example)}</b><br><span class="muted">${esc(p.translation)}</span></div><button class="action secondary" onclick="speak('${js(p.en)}')">🔊 Nghe</button></div>`).join('')}</div>`}
function startPhraseStudy(){queue=phrases.filter(p=>!state.phraseIds.includes(p.id)).slice(0,10);if(!queue.length)queue=phrases.slice(0,10);idx=0;mode='phrases';view='phraseStudy';nav();phraseStudy()}
function phraseStudy(){let a=document.getElementById('app');if(idx>=queue.length){view='phrases';nav();render();alert('🎉 Đã hoàn thành lượt cụm từ!');return}let p=queue[idx];a.innerHTML=`<div class="study"><div class="card"><span class="muted">Cụm ${idx+1} / ${queue.length}</span><div class="word">${esc(p.en)}</div><div class="ipa">${esc(p.ipa)}</div><div class="vi">${esc(p.vi)}</div><div class="example"><b>${esc(p.example)}</b><br>${esc(p.translation)}</div><div class="actions"><button class="action primary" onclick="speak('${js(p.en)}')">🔊 Nghe</button><button class="action secondary" onclick="speak('${js(p.en)}',.7)">🐢 Chậm</button></div><div class="choices"><button class="action bad" onclick="phraseAns(false)">❌ Chưa nhớ</button><button class="action good" onclick="phraseAns(true)">✅ Đã nhớ</button></div></div></div>`}
function phraseAns(ok){let p=queue[idx];p.level=ok?Math.min(5,(p.level||0)+1):Math.max(0,(p.level||0)-1);if(!state.phraseIds.includes(p.id))state.phraseIds.push(p.id);save();idx++;phraseStudy()}
function reviewPage(a){let due=vocab.filter(w=>due(w)&&(w.level||0)>0);a.innerHTML=`<div class="card"><h2>🔄 Ôn tập</h2><p>Hôm nay có <b>${due.length}</b> từ đến hạn ôn.</p><div class="actions"><button class="action primary" onclick="startStudy('review')">▶ Ôn từ đến hạn</button><button class="action secondary" onclick="reviewToday()">🔄 Ôn 10 từ hôm nay</button></div></div>`}
function listPage(a){a.innerHTML=`<div class="card"><h2>📝 Danh sách từ</h2><input id="search" placeholder="Tìm từ tiếng Anh hoặc nghĩa..." oninput="filterList()"><div id="list" class="section"></div></div>`;filterList()}
function filterList(){let q=(document.getElementById('search')?.value||'').toLowerCase();let arr=vocab.filter(w=>(w.en+' '+w.vi).toLowerCase().includes(q)).slice(0,100);document.getElementById('list').innerHTML=arr.map(w=>`<div class="card"><b>${esc(w.en)}</b> <span class="muted">${esc(w.ipa||'')}</span><br>${esc(w.vi)}<br><span class="muted">Level ${w.level||0} • ôn: ${w.nextReview||'chưa đặt lịch'}</span></div>`).join('')}
function statsPage(a){let levels=[0,1,2,3,4,5].map(l=>vocab.filter(w=>(w.level||0)===l).length);a.innerHTML=`<div class="card"><h2>📊 Tiến độ</h2>${levels.map((n,l)=>`<p><b>Level ${l}</b> — ${n} từ</p><div class="progress"><div style="width:${vocab.length?n/vocab.length*100:0}%"></div></div>`).join('')}<p class="section">Hôm nay: <b>${state.newToday}/10</b></p></div>`}
function dataPage(a){
 a.innerHTML=`<div class="card">
 <h2>📥 Nạp JSON</h2>
 <p class="muted">Nạp thêm từ vựng hoặc cụm từ mà không cần sửa code. Chọn đúng loại dữ liệu rồi chọn file JSON.</p>
 <div class="actions">
   <button class="action primary" onclick="document.getElementById('vocabFile').click()">📚 Nạp JSON từ vựng</button>
   <button class="action primary" onclick="document.getElementById('phraseFile').click()">💬 Nạp JSON cụm từ</button>
 </div>
 <input id="vocabFile" type="file" accept=".json,application/json" class="hidden" onchange="importJSON(this,'vocab')">
 <input id="phraseFile" type="file" accept=".json,application/json" class="hidden" onchange="importJSON(this,'phrases')">
 <div id="importStatus" class="section"></div>
 <hr>
 <h3>📤 Sao lưu dữ liệu</h3>
 <p class="muted">Xuất dữ liệu hiện tại để sao lưu hoặc chuyển sang thiết bị khác.</p>
 <div class="actions">
   <button class="action secondary" onclick="downloadJSON(vocab,'vstep-vocabulary.json')">📚 Xuất từ vựng</button>
   <button class="action secondary" onclick="downloadJSON(phrases,'vstep-phrases.json')">💬 Xuất cụm từ</button>
   <button class="action secondary" onclick="downloadJSON({vocab,phrases,state},'vstep-backup.json')">💾 Sao lưu tất cả</button>
 </div>
 <div class="card section"><b>Định dạng từ vựng:</b><pre>[{"id":"w9_001","en":"education","ipa":"/.../","vi":"giáo dục","example":"...","weekId":"w9","cat":"Education","level":0}]</pre></div>
 <div class="card section"><b>Định dạng cụm từ:</b><pre>[{"id":"p041","en":"take your time","ipa":"/.../","vi":"cứ từ từ","example":"Take your time.","translation":"Cứ từ từ.","cat":"Giao tiếp hằng ngày","level":0}]</pre></div>
 </div>`;
}
function uniqueMerge(existing,incoming){
 const map=new Map(existing.map(x=>[String(x.id||'').trim(),x]));
 let added=0, updated=0;
 incoming.forEach((x,i)=>{
   if(!x || typeof x!=='object') return;
   let id=String(x.id||'').trim();
   if(!id) id='import_'+Date.now()+'_'+i;
   x.id=id;
   if(map.has(id)){ map.set(id,{...map.get(id),...x}); updated++; }
   else { map.set(id,x); added++; }
 });
 return {data:[...map.values()],added,updated};
}
function normalizeVocabImport(arr){
 return arr.filter(x=>x&&typeof x==='object'&&x.en).map((x,i)=>({
   id:String(x.id||('imp_'+Date.now()+'_'+i)),
   en:String(x.en||'').trim(), ipa:String(x.ipa||''), vi:String(x.vi||''),
   example:String(x.example||''), weekId:String(x.weekId||'w9'),
   cat:String(x.cat||'General'), level:Number.isFinite(+x.level)?+x.level:0,
   lastReviewed:x.lastReviewed||null, nextReview:x.nextReview||null
 }));
}
function normalizePhraseImport(arr){
 return arr.filter(x=>x&&typeof x==='object'&&x.en).map((x,i)=>({
   id:String(x.id||('pimp_'+Date.now()+'_'+i)),
   en:String(x.en||'').trim(), ipa:String(x.ipa||''), vi:String(x.vi||''),
   example:String(x.example||''), translation:String(x.translation||x.viExample||''),
   cat:String(x.cat||'Giao tiếp hằng ngày'), level:Number.isFinite(+x.level)?+x.level:0,
   lastReviewed:x.lastReviewed||null, nextReview:x.nextReview||null
 }));
}
async function importJSON(input,type){
 const status=document.getElementById('importStatus');
 const file=input.files&&input.files[0]; if(!file)return;
 try{
   const raw=JSON.parse(await file.text());
   const arr=Array.isArray(raw)?raw:(raw.data||raw.vocab||raw.phrases);
   if(!Array.isArray(arr)) throw new Error('File JSON phải là một mảng [] hoặc có trường data/vocab/phrases.');
   if(type==='vocab'){
     const incoming=normalizeVocabImport(arr), r=uniqueMerge(vocab,incoming); vocab=r.data;
     const ids=new Set(vocab.map(x=>x.id)); state.todayIds=state.todayIds.filter(id=>ids.has(id));
     status.innerHTML=`<div class="card">✅ Đã nạp <b>${incoming.length}</b> từ. Thêm mới: <b>${r.added}</b>, cập nhật trùng ID: <b>${r.updated}</b>. Tiến độ cũ được giữ lại.</div>`;
   }else{
     const incoming=normalizePhraseImport(arr), r=uniqueMerge(phrases,incoming); phrases=r.data;
     status.innerHTML=`<div class="card">✅ Đã nạp <b>${incoming.length}</b> cụm từ. Thêm mới: <b>${r.added}</b>, cập nhật trùng ID: <b>${r.updated}</b>.</div>`;
   }
   save(); input.value='';
 }catch(e){status.innerHTML=`<div class="card" style="color:#991b1b">❌ Không nạp được: ${esc(e.message)}</div>`;input.value='';}
}
function downloadJSON(data,name){
 const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'});
 const url=URL.createObjectURL(blob), a=document.createElement('a'); a.href=url; a.download=name; a.click();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function js(s){return String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
resetDay();nav();render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js?v=5').catch(()=>{});
</script>
